name: TokenMaster
on:
  push:
    branches: [tokenmaster-dashboard]
    paths: ['apps/tokenmaster/**', 'apps/ccusage/src/cli.js', '.github/workflows/tokenmaster.yml']
  pull_request:
    paths: ['apps/tokenmaster/**', 'apps/ccusage/src/cli.js', '.github/workflows/tokenmaster.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/tokenmaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/tokenmaster/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run typecheck --workspaces=false
      - run: npm run build --workspaces=false
      - run: npm test --workspaces=false
      - run: npm run test:upstream --workspaces=false
      - run: npm run test:package --workspaces=false
